[project]
name = "ov1-analysis"
version = "0.0.0"
description = "Independent Python cross-checks, golden vectors, and report figures for CONTESTED // OV-1."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv]
# Supply-chain hardening: ignore any distribution uploaded after this date (7 days before
# the lockfile was created). Bump deliberately when you need a newer release.
exclude-newer = "2026-10-24T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ov1_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
