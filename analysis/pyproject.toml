[project]
name = "ov1-analysis"
version = "0.0.0"
description = "Independent Python cross-checks, golden vectors, and report figures for CONTESTED // OV-1."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv]
# Supply-chain hardening: ignore any distribution uploaded in the last 7 days. The window is
# relative (uv.lock records it as `exclude-newer-span = "P7D"`), so it never needs bumping.
# Needs a uv that understands relative durations (verified on 0.11.32; CI installs latest).
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ov1_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
